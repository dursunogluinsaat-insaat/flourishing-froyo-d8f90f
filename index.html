<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dursunoğlu Emlak CRM</title>
<link rel="stylesheet" href="https://jsdelivr.net">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#1a1a1a;background:#EEF2F7;min-height:100vh}
.hidden{display:none!important}
input,select,textarea{font-family:inherit;font-size:14px;color:#1a1a1a;background:#fff;border:1px solid #d0d0d0;border-radius:8px;padding:8px 12px;width:100%;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
input:focus,select:focus,textarea:focus{border-color:#1A5276;box-shadow:0 0 0 3px rgba(26,82,118,0.13)}
input.error{border-color:#c0392b!important}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid #d0d0d0;background:#fff;color:#1a1a1a;padding:8px 18px;font-size:14px;transition:all 0.15s}
button:hover{background:#f0f0f0}
button:disabled{opacity:0.5;cursor:not-allowed}
button.primary{background:#1A5276;color:#fff;border-color:#1A5276}
button.primary:hover{background:#154360}
button.secondary{background:#f5f5f5;border-color:#d0d0d0}
button.danger-btn{background:#A32D2D;color:#fff;border-color:#A32D2D}
button.success-btn{background:#1E8449;color:#fff;border-color:#1E8449}
label{font-size:13px;color:#555;display:block;margin-bottom:4px;font-weight:500}
.card{background:#fff;border:1px solid #D5E8F5;border-radius:12px;padding:1.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-blue{background:#D4E6F1;color:#1A5276}
.badge-green{background:#EAF3DE;color:#1E6A2E}
.badge-amber{background:#FAEEDA;color:#633806}
.badge-red{background:#FCEBEB;color:#791F1F}
.badge-purple{background:#EEEDFE;color:#3C3489}
.badge-gray{background:#f0f0f0;color:#444}
.badge-teal{background:#D1F2EB;color:#0E6655}
#toast{position:fixed;top:18px;right:18px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:340px}
#toast.show{opacity:1}
#toast.toast-blue{background:#1A5276;color:#fff}
#toast.toast-green{background:#1E6A2E;color:#fff}
#toast.toast-red{background:#A32D2D;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:#1A5276;border-bottom:2px solid #D4E6F1;background:#EBF5FB}
td{padding:8px 10px;border-bottom:1px solid #e8e8e8;vertical-align:middle}
tr:hover td{background:#F4F9FC}
.tabs{display:flex;gap:2px;margin-bottom:1.25rem;border-bottom:2px solid #D4E6F1;flex-wrap:wrap}
.tab{padding:8px 16px;font-size:14px;cursor:pointer;border:none;background:none;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:#1A5276;border-bottom-color:#1A5276;font-weight:600}
.stat-card{background:linear-gradient(135deg,#EBF5FB,#D4E6F1);border:1px solid #AED6F1;border-radius:10px;padding:1rem;text-align:center}
.stat-label{font-size:12px;color:#5D6D7E;margin-bottom:4px;font-weight:500}
.stat-val{font-size:26px;font-weight:700;color:#1A5276}
.topbar{background:linear-gradient(90deg,#1A3A5C,#1A5276);border-bottom:1px solid #154360;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(26,82,118,0.18)}
.topbar-brand{display:flex;align-items:center;gap:10px;color:#fff}
.topbar-brand span{font-weight:700;font-size:18px;letter-spacing:0.3px}
.container{max-width:1150px;margin:0 auto;padding:24px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:linear-gradient(135deg,#1A3A5C 0%,#1A5276 40%,#AED6F1 100%)}
.auth-card{background:#fff;border:1px solid #D4E6F1;border-radius:16px;padding:2rem;width:100%;max-width:430px;box-shadow:0 8px 40px rgba(26,82,118,0.18)}
.auth-logo{width:60px;height:60px;background:linear-gradient(135deg,#1A5276,#2E86C1);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 4px 12px rgba(26,82,118,0.25)}
.otp-inputs{display:flex;gap:8px;justify-content:center;margin:1rem 0}
.otp-inputs input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:600;padding:0;border-radius:8px}
.verify-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px}
.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.hint{font-size:12px;color:#aaa;margin-top:2px}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.role-btn{padding:10px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;text-align:center;transition:all 0.15s;font-size:13px;color:#555}
.role-btn:hover{border-color:#1A5276;color:#1A5276}
.role-btn.selected{border-color:#1A5276;background:#D4E6F1;color:#1A5276;font-weight:600}
.verified-chip{display:inline-flex;align-items:center;gap:4px;background:#EAF3DE;color:#1E6A2E;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500}
.unverified-chip{display:inline-flex;align-items:center;gap:4px;background:#FAEEDA;color:#633806;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500}
.tab-link{background:none;border:none;color:#1A5276;cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.section-title{font-size:16px;font-weight:700;color:#1A5276;margin-bottom:14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #D4E6F1;padding-bottom:8px}
/* HOME PAGE */
.home-hero{background:linear-gradient(135deg,#1A3A5C,#1A5276);color:#fff;border-radius:16px;padding:2.5rem;margin-bottom:1.5rem;text-align:center}
.home-hero h2{font-size:22px;font-weight:700;margin-bottom:8px}
.home-hero p{font-size:14px;opacity:0.85;margin-bottom:1.5rem}
.home-links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1.5rem}
.home-link-card{background:#fff;border:1.5px solid #D4E6F1;border-radius:12px;padding:1.2rem;text-align:center;text-decoration:none;color:#1A5276;transition:all 0.2s;cursor:pointer;display:block}
.home-link-card:hover{border-color:#1A5276;box-shadow:0 4px 16px rgba(26,82,118,0.13);transform:translateY(-2px)}
.home-link-card i{font-size:28px;display:block;margin-bottom:8px;color:#1A5276}
.home-link-card .lc-title{font-weight:700;font-size:14px;margin-bottom:4px}
.home-link-card .lc-desc{font-size:12px;color:#888}
/* PROFILE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border-radius:16px;padding:1.75rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.18)}
.modal-title{font-size:17px;font-weight:700;color:#1A5276;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;border-bottom:2px solid #D4E6F1;padding-bottom:10px}
/* PERMISSION CHIPS */
.perm-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.perm-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid #D4E6F1;background:#EBF5FB;color:#1A5276;cursor:pointer;transition:all 0.15s}
.perm-chip.active{background:#1A5276;color:#fff;border-color:#1A5276}
/* PENDING APPROVE SECTION */
.pending-row{background:#FEF9E7;border-left:4px solid #F39C12}
/* TOPBAR USER */
.topbar-user{display:flex;align-items:center;gap:10px;color:#fff}
.topbar-user-info{text-align:right}
.topbar-user-info .name{font-size:13px;font-weight:600}
.topbar-user-info .sub{font-size:11px;opacity:0.8}
.topbar-btn{font-size:12px;padding:6px 12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:7px}
.topbar-btn:hover{background:rgba(255,255,255,0.25)}
/* MÜŞTERI VİZİBİLİTY */
.customer-private{background:#FEF9E7}
/* AVATAR */
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,0.6)}

.sign div{min-height:75px;border-top:1px solid #777;padding-top:7px}
.paper .pt th{background:#eef2f6;border-bottom:2px solid #94a3b8}.paper .pt td{vertical-align:top}
.dochead{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid var(--navy);padding-bottom:9px;margin-bottom:14px}
.maddeler p{margin:4px 0;text-align:justify}
@media print{.paper{padding:7mm 9mm;min-height:0}.paper h1{font-size:14px;margin:6px 0 10px}.paper .company{font-size:12px}.paper .meta{font-size:8px;margin-bottom:8px}.paper h4{font-size:10px;margin:10px 0 4px;padding-bottom:3px}.paper p{font-size:8.5px;line-height:1.35;margin:2px 0}.paper table{font-size:8px}.paper td{padding:3px}.paper .dochead{padding-bottom:5px;margin-bottom:8px}.sign{margin-top:18px;gap:12px}.sign div{min-height:42px}}
</style>
</head>
<body>

<div id="toast" class="toast-blue"></div>

<!-- APP WRAPPER -->
<div id="app">
  <!-- Geliştirme kolaylığı için arayüz dökümü buraya dahil edilecektir -->
  <div class="topbar">
    <div class="topbar-brand">
      <i class="ti ti-building-skyscraper" style="font-size:24px"></i>
      <span>Dursunoğlu Emlak CRM</span>
    </div>
    <div class="topbar-user">
      <div class="topbar-user-info">
        <div class="name">Yönetici Paneli</div>
        <div class="sub">Dursunoğlu İnşaat & Gayrimenkul</div>
      </div>
      <button class="topbar-btn" onclick="showToast('Sistem aktif', 'green')">Aktif</button>
    </div>
  </div>

  <div class="container">
    <div class="card" style="margin-bottom: 20px;">
      <h3 class="section-title"><i class="ti ti-file-text"></i> Profesyonel Sözleşme Şablon Seçenekleri</h3>
      <div style="display:flex; flex-direction:column; gap:10px;">
