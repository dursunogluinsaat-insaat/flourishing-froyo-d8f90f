<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dursunoğlu Gayrimenkul Talep Formu</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f0f5fa;font:16px system-ui;color:#16364e}main{max-width:850px;margin:auto;background:white;padding:28px;border-radius:18px}h1{font-size:28px;margin:10px 0}p{line-height:1.6;color:#526779}.brand{font-weight:700;letter-spacing:1px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #bccbd7;border-radius:8px;font:inherit;background:white}textarea{min-height:100px}.wide{grid-column:1/-1}button{padding:14px 25px;background:#1a5276;color:white;border:0;border-radius:8px;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.5}.check{display:flex;gap:10px;font-weight:400;align-items:start}.check input{width:auto;margin-top:5px}.trap{position:absolute;left:-9999px}#status{white-space:pre-wrap}@media(max-width:550px){body{padding:10px}main{padding:20px}.grid{grid-template-columns:1fr}h1{font-size:24px}}</style><main><div class="brand">DURSUNOĞLU İNŞAAT GAYRİMENKUL</div><h1>Aradığınız Gayrimenkulü Bize Bildirin</h1><p>İhtiyacınızı paylaşın, size uygun portföyler için ekibimiz sizinle iletişime geçsin.</p><form id="requestForm"><div class="grid">
<div><label for="ad">Ad Soyad *</label><input id="ad" name="ad" type="text" maxlength="100" required></div><div><label for="tel">Telefon *</label><input id="tel" name="tel" type="tel" maxlength="20" required></div><div><label for="email">E-posta</label><input id="email" name="email" type="email" maxlength="150" ></div><div><label for="kategori">Talebiniz *</label><select id="kategori" name="kategori" required><option value="">Seçin</option><option value="satilik_daire">Satılık daire arıyorum</option><option value="kiralik_daire">Kiralık daire arıyorum</option><option value="arsa">Arsa arıyorum</option><option value="tarla">Tarla arıyorum</option><option value="kat_karsılıgı_arsa_veren">Arsamı kat karşılığı vermek istiyorum</option><option value="mutahhit">Müteahhit olarak kat karşılığı arsa arıyorum</option></select></div><div><label for="il">İl</label><input id="il" name="il" maxlength="80" ></div><div><label for="ilce">İlçe</label><input id="ilce" name="ilce" maxlength="80" ></div><div><label for="mahalle">Mahalle</label><input id="mahalle" name="mahalle" maxlength="80" ></div><div><label for="butceMin">En düşük bütçe (TL)</label><input id="butceMin" name="butceMin" maxlength="80" type="number" min="0" step="1"></div><div><label for="butceMax">En yüksek bütçe (TL)</label><input id="butceMax" name="butceMax" maxlength="80" type="number" min="0" step="1"></div><div><label for="odaSayisi">Oda sayısı</label><input id="odaSayisi" name="odaSayisi" maxlength="80" ></div><div><label for="sube">İlgili şube *</label><select id="sube" name="sube" required><option>İstanbul</option><option>Edremit</option></select></div><div class="wide"><label for="not">İhtiyaçlarınız / Ek açıklama</label><textarea id="not" name="not" maxlength="2000"></textarea></div><div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="wide check"><input type="checkbox" required>Talebimin değerlendirilmesi için ekibinizin benimle iletişime geçmesini istiyorum.</label><div class="wide"><button id="send" type="submit">Talebimi Gönder</button><p id="status" role="status" aria-live="polite"></p></div></div></form></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import {getFirestore,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';
const config={
  apiKey: "AIzaSyBL_tANuBKM4mcnVzPfJXNF1M6k92OLi0U",
  authDomain: "dursunoglu-emlak-crm.firebaseapp.com",
  projectId: "dursunoglu-emlak-crm",
  storageBucket: "dursunoglu-emlak-crm.firebasestorage.app",
  messagingSenderId: "506593684457",
  appId: "1:506593684457:web:e958dae8e7250a911af978",
  measurementId: "G-YNQQC9SR3W"
};
const db=getFirestore(initializeApp(config));const form=document.getElementById('requestForm'),button=document.getElementById('send'),status=document.getElementById('status');let pending=null,busy=false;
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!form.reportValidity())return;const f=new FormData(form);if(f.get('website'))return;const tel=String(f.get('tel')).replace(/[^0-9+]/g,'');if(!/^(?:\+90|90|0)?[1-9][0-9]{9}$/.test(tel)){status.textContent='Geçerli bir telefon numarası yazın.';return;}const min=Number(f.get('butceMin')),max=Number(f.get('butceMax'));if(min&&max&&min>max){status.textContent='En düşük bütçe en yüksek bütçeyi aşamaz.';return;}busy=true;button.disabled=true;status.textContent='Talebiniz gönderiliyor…';
try{const fields=['ad','email','kategori','il','ilce','mahalle','butceMin','butceMax','odaSayisi','not','sube'];const data={};fields.forEach(k=>data[k]=String(f.get(k)||'').trim());if(!data.ad)throw Error('Ad soyad gerekli.');if(!pending){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);pending={docId:crypto.randomUUID(),id:Date.now()*1000+bytes[0]%1000};}Object.assign(data,{id:pending.id,tel,islem:'Yeni',kaynak:'Web sitesi',iletisimIstegi:true,olusturuldu:serverTimestamp()});await setDoc(doc(db,'crm_web_talepler',pending.docId),data);status.textContent='Talebiniz alındı. Ekibimiz sizinle iletişime geçecektir.';form.reset();pending=null;}catch(err){console.error(err);status.textContent='Talebinizin kaydı doğrulanamadı. Lütfen tekrar deneyin. Sorun devam ederse 0216 430 92 49 numarasından bize ulaşın.';}finally{busy=false;button.disabled=false;}});
</script></html>
